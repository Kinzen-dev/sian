name: validate-and-merge
on:
  push:
    branches: ["claude/**", "guru/**"]
permissions:
  contents: write
concurrency:
  group: main-writer
  cancel-in-progress: false
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validate guru branch against main
        run: npm run sian -- validate --base origin/main
      - name: Merge into main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          git merge --no-ff "$GITHUB_SHA" -m "merge ${GITHUB_REF_NAME}"
          git push origin main
          git push origin --delete "$GITHUB_REF_NAME"
      - name: LINE predictions digest (dry-run without LINE_CHANNEL_ACCESS_TOKEN)
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
        run: |
          npm run sian -- notify --event predictions
          git add -A data/notify
          if git diff --staged --quiet; then echo "no notify state"; exit 0; fi
          git commit -m "chore(notify): predictions digest sent"
          git push origin main || (git fetch origin main && git rebase origin/main && git push origin main)
