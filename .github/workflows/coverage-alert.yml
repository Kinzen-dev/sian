name: coverage-alert
on:
  schedule:
    - cron: "30 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Fail (and email the owner) when an automated guru is missing a prediction inside 12h
        run: npm run sian -- coverage --alert-window 12h
